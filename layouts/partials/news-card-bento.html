<article class="news-card-bento hover-lift h-100">
    <a href="{{ .Permalink }}" class="card-link">
        <div class="card-image-wrapper">
            {{ if .Params.images }}
            <img src="{{ index .Params.images 0 | relURL }}" alt="{{ .Title }}" loading="lazy" class="bento-img">
            {{ else if .Params.image }}
            <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}" loading="lazy" class="bento-img">
            {{ else }}
            <img src="{{ " /images/sample2.jpg" | relURL }}" alt="{{ .Title }}" loading="lazy" class="bento-img">
            {{ end }}
            <div class="card-gradient"></div>
            <div class="card-info">
                {{ if .Params.category }}
                <span class="card-tag">{{ .Params.category }}</span>
                {{ end }}
                <h2 class="card-headline">{{ .Title }}</h2>
                <div class="card-details">
                    <time>{{ .Date.Format "02/01/2006" }}</time>
                    {{ if .ReadingTime }}
                    <span class="dot"></span>
                    <span>{{ .ReadingTime }} phút đọc</span>
                    {{ end }}
                </div>
            </div>
        </div>
    </a>
</article>

<style>
    .news-card-bento {
        border-radius: 30px;
        overflow: hidden;
        position: relative;
        background: var(--white);
        box-shadow: 0 10px 40px var(--shadow);
    }

    .card-image-wrapper {
        height: 100%;
        width: 100%;
        position: relative;
        overflow: hidden;
    }

    .bento-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .news-card-bento:hover .bento-img {
        transform: scale(1.1);
    }

    .card-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
        z-index: 1;
    }

    .card-info {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 30px;
        color: white;
        z-index: 2;
    }

    .card-tag {
        display: inline-block;
        background: var(--accent);
        color: var(--dark);
        padding: 4px 14px;
        border-radius: 50px;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 15px;
    }

    .card-headline {
        font-size: 1.8rem;
        font-weight: 900;
        line-height: 1.2;
        margin-bottom: 12px;
        letter-spacing: -0.5px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .card-details {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 600;
        font-size: 0.85rem;
        opacity: 0.8;
    }

    .dot {
        width: 4px;
        height: 4px;
        background: currentColor;
        border-radius: 50%;
    }

    .h-100 {
        height: 100%;
    }
</style>
