<div class="sidebar-widget">
    <h3 class="widget-title">League Standings</h3>
    <div class="standings-list">
        {{ with .Site.Data.standings }}
        {{ range first 5 (where . "league" $.Site.Params.league) }}
        <div class="standing-item">
            <span class="pos">{{ .pos }}</span>
            <span class="team">{{ .team }}</span>
            <span class="pts">{{ .pts }}</span>
        </div>
        {{ end }}
        {{ end }}
        <div class="placeholder-stat">Placeholder Standings</div>
    </div>
</div>

<style>
    .sidebar-widget {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 2rem;
    }

    .widget-title {
        font-size: 0.8rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--gray);
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 2px solid var(--primary);
    }

    .placeholder-stat {
        font-size: 0.9rem;
        color: var(--gray);
        font-style: italic;
    }
</style>
